# Deploy: build oleh GitHub Actions → GHCR, tinggal pull.
# Pemakaian: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  bot:
    image: ghcr.io/rafiq8k-studio/mouto-chan_discord:latest
    env_file: .env
    restart: unless-stopped
    volumes:
      - data:/app/data # sqlite verifikasi
volumes:
  data:
